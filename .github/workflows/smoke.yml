name: Smoke tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Real values come from repo secrets. Without them the checks run against
      # scripts/mock-supabase.mjs, an in-memory stand-in, so the signed-in checks still run.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54329' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-anon-key' }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL || 'smoke@example.com' }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD || 'smoke-pass' }}
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g agent-browser@0.43.0
      - name: Start the Supabase stand-in
        if: env.NEXT_PUBLIC_SUPABASE_URL == 'http://127.0.0.1:54329'
        run: node scripts/mock-supabase.mjs > mock-supabase.log 2>&1 &
      - run: npm run build
      - name: Start app
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && exit 0; sleep 1; done
          cat next.log; exit 1
      - run: npm run smoke
      - name: Server log on failure
        if: failure()
        run: cat next.log || true
