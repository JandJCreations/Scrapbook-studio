<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Scrapbook Studio</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        background: #ffffff;
        color: #18181b;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #fafafa;
        }
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #7c3aed, #d946ef);
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        max-width: 320px;
        opacity: 0.7;
        font-size: 14px;
      }
      button {
        margin-top: 8px;
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        background: #7c3aed;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="icon"></div>
    <h1>You're offline</h1>
    <p>Scrapbook Studio needs an internet connection to load your projects. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
